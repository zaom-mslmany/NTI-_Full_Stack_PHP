<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="form-box">

        <h2>Doctor Appointment Form</h2>
        <hr>

        <form>

            <div class="test">
                <label>Appointment Date</label>
                <input type="date">
            </div>

            <div class="test">
                <label>Appointment Time</label>
                <input type="time">
            </div>

            <div class="test">
                <label>Name</label>
                <input type="text" placeholder="First">
                <input type="text" placeholder="Last">
            </div>

            <div class="test">
                <label>Gender</label>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender" checked> Female
            </div>

            <div class="test">
                <label>Phone</label>
                <input type="tel" placeholder="####">
            </div>

            <div class="test">
                <label>Address</label>
                <input type="text" placeholder="City">
                <input type="text" placeholder="State">
            </div>

            <div class="test">
                <label>Your Query</label>
                <textarea rows="4"></textarea>
            </div>

            <div class="test">
                <label>Appointment Type</label>

                <p>Select which appointment type(s) you require</p>

                <input type="checkbox" checked> Cervix checkup
                <br>

                <input type="checkbox" checked> Heart checkup
                <br>

                <input type="checkbox"> Eye checkup
                <br>

                <input type="checkbox"> Hearing Test
            </div>

            <div class="test">
                <button type="submit">Send</button>
            </div>

        </form>

    </div>
    
</body>
</html>
